services:
  backend:
    build:
      context: ./backend
    container_name: healthsutra-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: healthsutra-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  postgres:
    image: postgres:16
    container_name: healthsutra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthsutra
      POSTGRES_PASSWORD: healthsutra
      POSTGRES_DB: healthsutra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
